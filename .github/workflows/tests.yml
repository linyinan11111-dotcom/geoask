name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade -r requirements-dev.txt "setuptools>=77" wheel
      - run: python -m pytest -q
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - shell: bash
        run: python scripts/verify_wheel.py dist/geoask-*.whl
