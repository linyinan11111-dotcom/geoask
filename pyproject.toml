[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoask"
description = "Natural-language nearby search with local embeddings and DuckDB spatial"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies", "version"]

[project.urls]
Repository = "https://github.com/linyinan11111-dotcom/geoask"
Releases = "https://github.com/linyinan11111-dotcom/geoask/releases"

[project.scripts]
geoask = "geoask:cli"

[project.gui-scripts]
geoask-gui = "geoask_gui:main"

[tool.setuptools]
py-modules = ["geoask", "geoask_service", "geoask_gui", "geoask_map", "geoask_location", "geoask_routing", "geoask_places", "geoask_data", "geoask_parking", "geoask_runtime", "geoask_credentials", "geoask_amap"]
packages = ["geoask_resources"]

[tool.setuptools.dynamic]
version = {attr = "geoask_resources.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: real local embedding model or bundled spatial data"]
