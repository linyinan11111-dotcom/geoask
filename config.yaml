# 路径相对于本配置文件，不依赖运行命令时的目录。
default_location: [116.46, 39.92]  # 北京国贸周边，WGS84 经度、纬度
default_radius: 1000
limit: 10

# 高德 GCJ-02 / Web Mercator 底图；可换成其他兼容 XYZ 瓦片服务。
map:
  tile_url: https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}
  attribution: © 高德地图
  user_agent: geoask/0.2 (local desktop nearby search)
  coordinate_system: gcj02

# 地点、停车场与路线只使用高德 Web 服务，不读取本地 OSM 数据。
amap:
  enabled: true
  primary: true
  endpoint: https://restapi.amap.com/v5/place/text
  api_key_env: AMAP_WEB_KEY
  security_code_env: AMAP_SECURITY_CODE
  timeout_seconds: 12

routing:
  provider: amap
  timeout_seconds: 20

# LLM 接口：只解析意图。密钥可在界面保存到本机或用环境变量，勿写入本文件。
llm:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  response_format: json_object  # DeepSeek JSON 模式 + 本地 Pydantic 严格校验
  timeout_seconds: 30

# 若使用 OpenAI，替换 llm 为：
# llm:
#   base_url: https://api.openai.com/v1
#   model: gpt-4o-mini
#   api_key_env: OPENAI_API_KEY
#   response_format: structured
#   timeout_seconds: 30
# 本地兼容接口同样修改 base_url/model/api_key_env；密钥可使用本地服务要求的占位值。
